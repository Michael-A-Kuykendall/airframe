name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --all-features
    - name: Test (no GPU required)
      run: cargo test --workspace --lib -- --test-threads=1 --skip backend::bindless::kv_cache::tests --skip backend::bindless::pipeline_shift::tests --skip backend::bindless::test_int4_parity::int4_parity_tests --skip backend::bindless::tests::tests_inner --skip backend::bindless::tests_gpu_math::tests

    - name: PPT Contract Tests (no GPU required)
      # --test-threads=1: the invariant log is a process-global static, so
      # contract tests must not run in parallel (per the PPT framework design).
      run: cargo test -p airframe --test test_contracts -- --test-threads=1

    - name: Observe tests (no GPU required)
      run: cargo test -p airframe-observe

    - name: Generation accounting contracts
      run: cargo test -p airframe-observe --test generation_accounting -- --test-threads=1

    - name: Build with ISF features
      run: cargo build

  publish:
    name: Publish to crates.io
    if: github.repository == 'Michael-A-Kuykendall/airframe' && startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Publish airframe-observe
      working-directory: crates/airframe_observe
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -o pipefail
        if cargo publish 2>&1 | tee /tmp/pub_observe.log; then
          echo "airframe-observe published"
        elif grep -q "already exists" /tmp/pub_observe.log; then
          echo "airframe-observe already published (idempotent) — OK"
        else
          echo "::error::airframe-observe publish failed"; cat /tmp/pub_observe.log; exit 1
        fi
    - name: Publish airframe
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        set -o pipefail
        if cargo publish 2>&1 | tee /tmp/pub_airframe.log; then
          echo "airframe published"
        elif grep -q "already exists" /tmp/pub_airframe.log; then
          echo "airframe already published (idempotent) — OK"
        else
          echo "::error::airframe publish failed"; cat /tmp/pub_airframe.log; exit 1
        fi
