[package]
name = "airframe-observe"
version = "0.1.4"
publish = true
edition = "2021"
license = "MIT"
repository = "https://github.com/Michael-A-Kuykendall/airframe"
homepage = "https://github.com/Michael-A-Kuykendall/airframe"
documentation = "https://docs.rs/airframe-observe"
description = "Inference facts, observers and host-side coordination contracts powered by Dzero."
exclude = [".gitignore", ".gitattributes"]

# Patent Notice: This crate implements the Fused Semantic Execution (FSE)
# Inference Observation architecture — a selector-first, compile-once,
# single-pass model for capturing and broadcasting inference state to multiple
# independent observers simultaneously. This architecture and its application
# to AI inference observability is covered by a pending US patent by
# Michael A. Kuykendall. All rights reserved.
# Contact: michaelallenkuykendall@gmail.com

[features]
default = []

[dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

# dzero: the FSE reactive fact engine
# Published to crates.io as the generic saturation core.
dzero       = "0.1"

# NOTE: airframe dep removed — airframe now optionally depends on airframe-observe,
# not the other way around. This breaks the circular dependency.
