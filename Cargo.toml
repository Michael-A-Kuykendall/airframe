[workspace]
# All checked-in crates are workspace members. Deferred/private crates are kept
# off this public branch until they are intentionally wired into the product.
members = ["crates/*"]

[package]
name = "airframe"
version = "0.4.2"
edition = "2021"
description = "Pure-Rust WebGPU inference engine for GGUF models. No C++ toolchain, no llama.cpp. Runs on NVIDIA, AMD, Intel, and Apple Silicon via wgpu."
license = "MIT"
repository = "https://github.com/Michael-A-Kuykendall/airframe"
homepage = "https://github.com/Michael-A-Kuykendall/airframe"
readme = "README.md"
authors = ["Michael A. Kuykendall <michaelallenkuykendall@gmail.com>"]
keywords = ["llm", "inference", "gguf", "wgpu", "webgpu"]
categories = ["science", "simulation", "graphics"]
publish = true

[dependencies]
# Core dependencies
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.4"
memmap2 = "0.9"
half = "2.4"
shimmytok = "0.8.2"
chrono = { version = "0.4.43", features = ["serde"] }
wgpu = "27.0.1"
pollster = "0.4.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4.5.56", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
libfse = { path = "crates/libfse", version = "0.1.3" }
schoolmarm = "0.1.1"
sha2 = "0.10"
aho-corasick = { version = "1.1", features = ["std"] }
shimmyjinja = { version = "0.5.0" }
# PPT + Invariant testing framework (objective quality gates). See src/invariant_ppt.rs.
lazy_static = "1.4"

# Optional: ISF (Inference Saturation Fabric) — depends on dzero.
# Enable with --features isf. Not published to crates.io.
airframe-observe = { path = "crates/airframe_observe", version = "0.1.0", optional = true }

[features]
default = ["isf"]
isf = ["dep:airframe-observe"]
dev = ["isf"]

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["full"] }
naga = { version = "27.0", features = ["wgsl-in"] }

[[bin]]
name = "layer_dump_gpu"
path = "src/bin/layer_dump_gpu.rs"
required-features = ["isf"]

[[bin]]
name = "stack_dump_gpu"
path = "src/bin/stack_dump_gpu.rs"
required-features = ["isf"]

[[bin]]
name = "invariant_probe"
path = "src/bin/invariant_probe.rs"
required-features = ["isf"]

[[bin]]
name = "decode_gate"
path = "src/bin/decode_gate.rs"
required-features = ["isf"]

[[bin]]
name = "kv_head_probe"
path = "src/bin/kv_head_probe.rs"
required-features = ["isf"]

[[bin]]
name = "kv_dump_probe"
path = "src/bin/kv_dump_probe.rs"
required-features = ["isf"]

[[bin]]
name = "kv_chain_probe"
path = "src/bin/kv_chain_probe.rs"
required-features = ["isf"]

[[bin]]
name = "quant_verify"
path = "src/bin/quant_verify.rs"
required-features = ["isf"]

[[bin]]
name = "cert_check"
path = "src/bin/cert_check.rs"
required-features = ["isf"]

[[bin]]
name = "probe_tokens"
path = "src/bin/probe_tokens.rs"
required-features = ["isf"]

[[bin]]
name = "vault_generator"
path = "src/bin/vault_generator.rs"
required-features = ["isf"]

[[bin]]
name = "window_boundary_probe"
path = "src/bin/window_boundary_probe.rs"

[[bin]]
name = "dump_template"
path = "src/bin/dump_template.rs"
required-features = ["isf"]

[[test]]
name = "test_invariants"
required-features = ["isf"]

[[test]]
name = "tinyllama_smoke"
required-features = ["isf"]

[[test]]
name = "algebraic_audit"
required-features = ["isf"]

[[test]]
name = "gpu_22layer_verify"
required-features = ["isf"]

[[test]]
name = "math_pack_detection"
required-features = ["isf"]

[[test]]
name = "tiled_gemm_math"
required-features = ["isf"]
